spring:
  kafka:
    bootstrap-servers: localhost:29093
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


management:
  endpoints:
    web:
      exposure:
        include: prometheus

  prometheus:
    metrics:
      export:
        enabled: true


topic-to-send-message: your-topic-name

server:
  tomcat:
    threads:
      max: 201
      min-spare-threads: 11
resilience4j:
  ratelimiter:
    instances:
      apiRateLimiter:
        limit-for-period: 5
        limit-refresh-period: 10s
        timeout-duration: 0
  circuitbreaker:
    instances:
      apiCircuitBreaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        sliding-window-type: count_based
        sliding-window-size: 10

